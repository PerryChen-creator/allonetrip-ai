name: Next.js CI 機器人檢查

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 下載最新的程式碼
        uses: actions/checkout@v4

      - name: ⚙️ 準備 Node.js 執行環境
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 安裝專案所需套件
        run: npm ci

      - name: 🔎 檢查程式碼語法 (ESLint)
        run: npm run lint

      - name: 🏗️ 試跑一次發布流程 (Build)
        run: npm run build